plugins {
    id 'com.android.application'
}

android {
    namespace 'de.bedrocklan.bridge'
    compileSdk 34

    defaultConfig {
        applicationId 'de.bedrocklan.bridge'
        minSdk 26
        targetSdk 34
        versionCode 18
        versionName '0.0.7'
    }

    signingConfigs {
        release {
            // Wird aus Umgebungsvariablen gefüllt (GitHub Actions Secrets).
            // Ohne KEYSTORE_FILE bleibt die Konfiguration leer und Release bleibt unsigniert.
            if (System.getenv('KEYSTORE_FILE') != null) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEYSTORE_ALIAS')
                keyPassword System.getenv('KEYSTORE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KEYSTORE_FILE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
        // Core-Library-Desugaring: deckt Matcher#appendReplacement/appendTail (API 34) bei minSdk 26 ab.
        // URLEncoder.encode(String, Charset) (API 33) wird NICHT desugart und bleibt ein Main-Code-Fehler.
        coreLibraryDesugaringEnabled true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // Google WebRTC (NetherNet läuft über WebRTC-DataChannels)
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
    // FileProvider wird im AndroidManifest referenziert.
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
    // Echte org.json-Implementierung für JVM-Tests (android.jar-Stubs werfen sonst).
    testImplementation 'org.json:json:20240303'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
