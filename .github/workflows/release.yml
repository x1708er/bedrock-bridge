name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

# gh release create/upload benötigt Schreibrechte am Release-Asset.
permissions:
  contents: write

jobs:
  release:
    name: Signiertes Release-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Version-Konsistenz pruefen (Tag vs. versionName)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION_NAME="$(grep -oP "versionName\s+'\K[^']+" app/build.gradle)"
          if [ "$TAG" != "$VERSION_NAME" ]; then
            echo "::error::Git-Tag v$TAG entspricht nicht versionName '$VERSION_NAME' aus app/build.gradle."
            exit 1
          fi
          echo "Version $TAG stimmt mit versionName ueberein."

      - name: Keystore-Secrets pruefen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          missing=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEYSTORE_ALIAS KEYSTORE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Secret '$var' fehlt. Signierte Release-Builds benoetigen KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEYSTORE_ALIAS und KEYSTORE_KEY_PASSWORD als GitHub-Actions-Secrets."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 ist kein gueltiges Base64 – Secret pruefen."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::KEYSTORE_BASE64 dekodiert zu einer leeren Datei (Groesse 0) – Secret pruefen."
            exit 1
          fi
          echo "Keystore bereitgestellt: $(wc -c < "$RUNNER_TEMP/release.keystore") Bytes."

      - name: Release-APK bauen (signiert)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK an GitHub Release anhaengen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: BedrockLanBruecke-APK
          path: app/build/outputs/apk/release/app-release.apk