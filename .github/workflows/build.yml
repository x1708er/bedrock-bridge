name: Build & CI

on:
  # Pull-Requests bevorzugt; Push nur für main, damit CI nicht doppelt läuft.
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Tests & Lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit-Tests und Lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon

  manual-release:
    name: Release-APK bauen (manuell, signiert)
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/release.yml
    secrets: inherit